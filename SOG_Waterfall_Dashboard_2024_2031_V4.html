const DEFAULT_TG = { total:D.target_total, g27:5.0, gPost:2.0, newC:null, newK:null, innC:null, innK:null };
/* Annual target trend: 2026 = team target; 2027 = 2026 target × (1 + g27); 2028–2031 = prior-year target × (1 + gPost).
   Each year compounds once on the prior year's target, so 2027 is never shifted twice. */
const TARGET_YEARS = [2026,2027,2028,2029,2030,2031];
function targetFor(year, tg) {
  if (year < 2026 || tg.total == null) return null;
  let t = tg.total;
  for (let y = 2027; y <= year; y++) t *= 1 + ((y === 2027 ? tg.g27 : tg.gPost) || 0)/100;
  return t;
}
const growthLabel = (y, tg) => y === 2026 ? 'team target' : y === 2027 ? `+${tg.g27}% on 2026` : `+${tg.gPost}% on ${y-1}`;
function periodTarget(r, tg) {          // target matched to the period shown (YTD / balance of year pro-rated with 2025 seasonality)
  const t = targetFor(r.year, tg); if (t == null) return null;
  return r.period === 'ytd' ? t*D.ytd_share.all : r.period === 'boy' ? t*(1-D.ytd_share.all) : t;

function norm(raw, year, kind, period) {
  const f = o => ({ base:o.base, sss:o.sss, nw:o.new, inn:o.inn, innBase:o.inn_base, innNew:o.inn_new, cy:o.cy, ly:o.ly_total,

    '2026boy': norm(D.R['2026BOY'], 2026, 'boy', 'boy'),
    2026: norm(D.R['2026FY'], 2026, 'projected', 'fy'),
  };
  let prev = out[2026];
  let cohort = { c:{ n:D.cohort26.cafe.n, sales:D.cohort26.cafe.fy, monthly:D.cohort26.cafe.monthly, names:D.cohort26.cafe.names },
                 k:{ n:D.cohort26.kiosk.n, sales:D.cohort26.kiosk.fy, monthly:D.cohort26.kiosk.monthly, names:D.cohort26.kiosk.names } };
  for (const y of FC_YEARS) {
    const next = {};
    const grow = (f, g, innRate, tiers) => {
      const p = prev[f], co = cohort[f], gf = Math.pow(1+g/100, y-2026);
      const base = p.cy - co.sales, nBase = p.nCy - co.n, sss = base*g/100;
      const second = co.monthly * 12 * (1+g/100);
      const tierRows = tiers.map(t => ({ ...t, sales: t.n * t.monthly*1e6 * gf * sb.monthsFirst, monthlyY: t.monthly*1e6*gf }));
      const first = tierRows.reduce((a,t)=>a+t.sales,0), nOpen = tiers.reduce((a,t)=>a+(+t.n||0),0);
      const nw = second + first, inn = base*innRate/100;
      next[f] = { n:nOpen, sales:first, monthly: tierRows.reduce((a,t)=>a+t.n*t.monthlyY,0) };

    };

    prev = out[y]; cohort = next;
  }

      tip:{ stores:r.c.nBase, avg:avg(r.c.sssCyEx,r.c.nBase), formula:`(CY gross of baseline cafés − their CY innovation sales) − baseline = ${mfull(r.c.sssCyEx)} − ${mfull(r.c.base)}` } },
    { key:'sssK', label:'Same-Store Sales Growth – Kiosk', short:['SSS Growth','Kiosk'], v:r.k.sss, type:'delta', badge:pct(r.k.sss/r.k.base,2), badgeTone:true,
      tip:{ stores:r.k.nBase, avg:avg(r.k.sssCyEx,r.k.nBase), formula:`(CY gross of baseline kiosks − their CY innovation sales) − baseline = ${mfull(r.k.sssCyEx)} − ${mfull(r.k.base)}` } },
    { key:'newC', label:'New-Store Sales Growth – Café', short:['New Stores','Café'], v:r.c.nw, type:'new', badge: ach(r.c.nw, tg.newC, 'cafe') || `${pct(r.c.nw/ly,2)} of LY`,
      tip:{ stores:r.c.nNew, avg:avg(r.c.nw,r.c.nNew), formula:newTip('c','cafés') } },
    { key:'newK', label:'New-Store Sales Growth – Kiosk', short:['New Stores','Kiosk'], v:r.k.nw, type:'new', badge: ach(r.k.nw, tg.newK, 'kiosk') || `${pct(r.k.nw/ly,2)} of LY`,
      tip:{ stores:r.k.nNew, avg:avg(r.k.nw,r.k.nNew), formula:newTip('k','kiosks') } },
    { key:'innC', label:'Innovation – Café', short:['Innovation','Café'], v:r.c.inn, type:'inn', badge: ach(r.c.inn, tg.innC, 'cafe') || `${pct(r.c.inn/ly,2)} of LY`,
      tip:{ stores:r.c.nCy, avg:null, split:[r.c.innBase, r.c.innNew], items:r.c.items, formula: fcst ? `Café innovation run-rate × café baseline` : `CY gross of items first sold in ${r.year} (company-wide) at cafés, summed per outlet` } },
    { key:'innK', label:'Innovation – Kiosk', short:['Innovation','Kiosk'], v:r.k.inn, type:'inn', badge: ach(r.k.inn, tg.innK, 'kiosk') || `${pct(r.k.inn/ly,2)} of LY`,
      tip:{ stores:r.k.nCy, avg:null, split:[r.k.innBase, r.k.innNew], items:r.k.items, formula: fcst ? `Kiosk innovation run-rate × kiosk baseline` : `CY gross of items first sold in ${r.year} (company-wide) at kiosks, summed per outlet` } },
    { key:'total', label:'Total Gross Sales', short:['Total','Gross Sales'], v:tot(r,'cy'), type:'total',
      badge: tgtTotal ? `${pct(tot(r,'cy')/tgtTotal,1,false)} of target` : `${pct(tot(r,'cy')/ly-1,2)} YoY`,
      tip:{ stores:(r.c.nCy||0)+(r.k.nCy||0)||null, avg:((r.c.nCy||0)+(r.k.nCy||0)) ? tot(r,'cy')/((r.c.nCy||0)+(r.k.nCy||0)) : null,
            formula:`Sum of pillars 1–7 · YoY ${pct(tot(r,'cy')/ly-1,2)} vs LY ${mfull(ly)} (of which ${mfull(ly-tot(r,'base'))} from LY stores outside the baseline)` + (tgtTotal ? ` · ${r.period==='fy'?'Annual':'Pro-rata'} target ${mfull(tgtTotal)} (${growthLabel(r.year, tg)}), variance ${mfull(tot(r,'cy')-tgtTotal)}` : '') } },
  ];
  let run = 0;
  for (const b of B) {
    if (b.type==='total') { b.start=0; b.end=b.v; } else { b.start=run; b.end=run+b.v; run=b.end; }
    b.color = b.type==='base'?C.base : b.type==='total'?C.total : b.type==='new'?C.newS : b.type==='inn'?C.inn : (b.v>=0?C.pos:C.neg);
    b.hatch = b.type==='delta' && b.v < 0;
  }
  return B;
}

/* ---------- waterfall ---------- */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw||1))); const n = raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function Waterfall({ bars, fmt, zoom, title }) {
  const W=1120, H=470, M={t:58,r:16,b:66,l:86}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const [hover, setHover] = useState(null);
  const hi = Math.max(...bars.map(b=>Math.max(b.start,b.end)));
  let lo = 0;
  if (zoom) { const raw = Math.min(...bars.filter(b=>b.type!=='total'&&b.key!=='baseC').map(b=>Math.min(b.start,b.end))); lo = Math.max(0, raw-(hi-raw)*0.9); }
  const step = niceStep((hi-lo)/5); lo = Math.floor(lo/step)*step; const top = Math.ceil(hi*1.06/step)*step;
  const y = v => M.t + ih - (Math.max(v,lo)-lo)/(top-lo)*ih;
  const bw = iw/bars.length, pad = bw*0.2;
  const ticks=[]; for (let v=lo; v<=top+1; v+=step) ticks.push(v);
  return <div className="relative">
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label={title}>
      <defs><pattern id="hatchNeg" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill={C.neg}/><line x1="0" y1="0" x2="0" y2="6" stroke="#fff" strokeOpacity=".45" strokeWidth="2"/></pattern></defs>
      {ticks.map(t => <g key={t}><line x1={M.l} x2={W-M.r} y1={y(t)} y2={y(t)} stroke={C.grid}/>
        <text x={M.l-10} y={y(t)+4} textAnchor="end" fontSize="12" fill={C.ink2} className="tnum">{(fmt.unitPct?fmt.val(t):fmt.money(t,false,true)).replace('.0M','M').replace('.00%','%')}</text></g>)}
      {bars.map((b,i) => {
        const x = M.l+i*bw+pad, w = bw-2*pad, y1 = y(Math.max(b.start,b.end)), y2 = y(Math.min(b.start,b.end)), h = Math.max(2, y2-y1);
        const clipped = zoom && lo>0 && Math.min(b.start,b.end) < lo, next = bars[i+1];
        return <g key={b.key} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
          <rect x={M.l+i*bw} y={M.t} width={bw} height={ih} fill={hover===i?'#3B241808':'transparent'}/>
          <rect x={x} y={y1} width={w} height={h} rx="4" fill={b.hatch?'url(#hatchNeg)':b.color}/>
          {clipped && <path d={`M${x-3},${y2-10} l${w/4+1.5},-6 l${w/4},6 l${w/4},-6 l${w/4+1.5},6`} stroke={'#FCF9F6'} strokeWidth="3" fill="none"/>}
          {next && next.type!=='total' && <line x1={x+w} x2={M.l+(i+1)*bw+pad} y1={y(b.end)} y2={y(b.end)} stroke={C.axis} strokeDasharray="3 3"/>}
          <text x={x+w/2} y={y1-(b.badge?24:8)} textAnchor="middle" fontSize="13" fontWeight="600" fill={C.ink} className="tnum">{fmt.val(b.v, b.type!=='base'&&b.type!=='total')}</text>
          {b.badge && <text x={x+w/2} y={y1-8} textAnchor="middle" fontSize="11.5" fontWeight="600" className="tnum"
            fill={b.badgeTone ? (b.v>=0?'#2F6B2A':'#A5321D') : C.ink2}>{b.badgeTone ? (b.v>=0?'▲ ':'▼ ') : ''}{b.badge}</text>}
          <text x={x+w/2} y={H-M.b+20} textAnchor="middle" fontSize="12" fontWeight="600" fill={C.ink}>{b.short[0]}</text>
          <text x={x+w/2} y={H-M.b+36} textAnchor="middle" fontSize="12" fill={C.ink2}>{b.short[1]}</text>
        </g>; })}
      <line x1={M.l} x2={W-M.r} y1={M.t+ih} y2={M.t+ih} stroke={C.axis}/>
    </svg>
    {hover!=null && <Tooltip b={bars[hover]} fmt={fmt} left={(M.l+hover*bw+bw/2)/W*100}/>}
  </div>;
}
function Tooltip({ b, fmt, left }) {
  const t = b.tip, side = left>58 ? { right:`${100-left+4}%` } : { left:`${left+4}%` };
  return <div className="absolute top-10 z-10 w-80 card shadow-lg p-3 text-xs pointer-events-none" style={side}>

  </div>;
}

/* ---------- cannibalization lens ---------- */
function Cannibalization({ r, fmt }) {
  const row = (f, name) => { const x = r[f], core = x.sss/x.base, innS = x.innBase/x.base, all = (x.sss+x.innBase)/x.base;

/* ---------- trend charts ---------- */
function TrendTotals({ all, fmt, onPick, tg }) {
  const W=1120, H=300, M={t:30,r:16,b:40,l:86}, iw=W-M.l-M.r, ih=H-M.t-M.b;
  const rows = [{ year:2024, v:D.T24.cafe+D.T24.kiosk, kind:'actual' }, { year:2025, v:tot(all[2025],'cy'), kind:'actual' },
    { year:2026, v:tot(all[2026],'cy'), ytd:tot(all['2026ytd'],'cy'), kind:'projected' }, ...FC_YEARS.map(y=>({ year:y, v:tot(all[y],'cy'), kind:'forecast' }))];
  const [hv, setHv] = useState(null);
  rows.forEach(r => { r.t = targetFor(r.year, tg); });
  const max = Math.max(...rows.map(r=>Math.max(r.v, r.t||0))), step = niceStep(max/5), top = Math.ceil(max*1.12/step)*step;
  const y = v => M.t+ih-v/top*ih, bw = iw/rows.length; const ticks=[]; for (let v=0; v<=top; v+=step) ticks.push(v);

        <Kpi title={is26 ? `2026 gross sales · ${period==='ytd'?'YTD':period==='boy'?'Oct–Dec':'full year'}` : `${year} gross sales`} value={fmt.money(cy)}
          badge={tgtTotal ? <span className={`pill ${cy>=tgtTotal?'pos':'neg'}`}>{pct(cy/tgtTotal,1,false)} of target</span> : null}>
          <Row label="Café" v={r.c.cy} fmt={fmt} signed={false}/><Row label="Kiosk" v={r.k.cy} fmt={fmt} signed={false}/>
          {tgtTotal && <div className="text-[11px]" style={{color:'var(--muted)'}}>{r.period==='fy'?'Annual target':'Pro-rata target'} {fmt.money(tgtTotal)} ({growthLabel(year, tg)}) · variance {fmt.money(cy-tgtTotal,true)}</div>}
        </Kpi>
        <Kpi title={`Variance vs ${lyLabel}`} value={fmt.money(cy-ly,true)} badge={<Badge v={cy/ly-1}/>}>
          <Row label="Café" v={r.c.cy-r.c.ly} p={r.c.cy/r.c.ly-1} fmt={fmt}/><Row label="Kiosk" v={r.k.cy-r.k.ly} p={r.k.cy/r.k.ly-1} fmt={fmt}/>
          <div className="text-[11px]" style={{color:'var(--muted)'}}>LY {fmt.money(ly)}</div>
        </Kpi>
        <Kpi title="Organic same-store" value={fmt.money(tot(r,'sss'),true)} badge={<Badge v={tot(r,'sss')/ly}/>}>
          <Row label="Café"  v={r.c.sss} p={r.c.sss/r.c.base} fmt={fmt}/><Row label="Kiosk"  v={r.k.sss} p={r.k.sss/r.k.base} fmt={fmt}/>
          <div className="text-[11px]" style={{color:'var(--muted)'}}>{r.c.nBase} cafés · {r.k.nBase} kiosks · rows = SSSG vs baseline</div>
        </Kpi>
        <Kpi title="Expansion · new stores" value={fmt.money(tot(r,'nw'),true)} badge={<Badge v={tot(r,'nw')/ly}/>}>
          <Row label="Café"  v={r.c.nw} p={r.c.nw/ly} fmt={fmt}/><Row label="Kiosk"  v={r.k.nw} p={r.k.nw/ly} fmt={fmt}/>
          <div className="text-[11px]" style={{color:'var(--muted)'}}>{r.c.nNew} cafés · {r.k.nNew} kiosks · less LY non-baseline stores {fmt.money(-(ly-tot(r,'base')),true)}</div>
        </Kpi>
        <Kpi title="Innovation" value={fmt.money(tot(r,'inn'),true)} badge={<Badge v={tot(r,'inn')/ly}/>}>
          <Row label="Café" v={r.c.inn} p={r.c.inn/ly} fmt={fmt}/><Row label="Kiosk" v={r.k.inn} p={r.k.inn/ly} fmt={fmt}/>
          <div className="text-[11px]" style={{color:'var(--muted)'}}>{fcst ? 'Run-rate on baseline' : `At same stores ${fmt.money(tot(r,'innBase'))} · new stores ${fmt.money(tot(r,'innNew'))}`}</div>
        </Kpi>
      </div>

      <div className={`grid grid-cols-1 gap-4 ${showAside ? 'xl:grid-cols-[1fr_340px]' : ''}`}>
        <div className="min-w-0 flex flex-col">
          <section className="card p-4">
            <div className="flex flex-wrap items-start justify-between gap-2">
              <div><h2 className="text-xl font-semibold">Where the {year}{is26?` ${period==='ytd'?'YTD':period==='boy'?'balance-of-year':'full-year'}`:''} growth came from</h2>
                <div className="text-sm" style={{color:'var(--muted)'}}>{is26 ? PERIOD_LABEL[period] : 'Full year'} · {year} vs {year-1} · {unit==='pct'?'% of ending total':cur==='USD'?'US dollars':'Philippine pesos'}</div></div>
              <KindTag kind={r.kind}/></div>
            <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs mt-2" style={{color:'var(--muted)'}}>
              {[[C.base,'Same-store baseline'],[C.pos,'Same-store growth ▲'],[C.neg,'Same-store decline ▼ (hatched)'],[C.newS,'New stores'],[C.inn,'Innovation'],[C.total,'Ending total']].map(([c,l])=>
                <span key={l} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{background:c}}/>{l}</span>)}</div>
            <Waterfall bars={bars} fmt={fmtBars} zoom={zoom} title={`SOG waterfall ${year}`}/>
            <p className="text-xs leading-relaxed" style={{color:'var(--muted)'}}>
              {zoom && 'Axis does not start at zero (zigzag = truncated bar). '}Pillars 1–7 tie exactly to the ending total.
              {is26 && period!=='ytd' && ' Oct–Dec 2026 is projected: Jan–Sep actual × FY2025/9M2025 seasonality per format.'}
              {tgtTotal && ` The total bar's target badge uses the ${year} annual target (${growthLabel(year, tg)})` + (r.period==='ytd' ? ', pro-rated to Jan–Sep with 2025 seasonality.' : r.period==='boy' ? ', pro-rated to Oct–Dec with 2025 seasonality.' : '.')}
              {fcst && ' Forecast year: actual-only indicators (traffic, store-level innovation split, pillar targets) are hidden.'}
            </p>
          </section>
          <Cannibalization r={r} fmt={fmt}/>
          {auditInline && <div className="mt-4 hidden xl:flex flex-1 flex-col min-h-0"><AuditTable key="audit-inline" all={all} fmt={fmt} tg={tg} inline={true}/></div>}
        </div>
        {showAside && <aside className="space-y-4">
          {showSandbox && <Sandbox sb={sb} setSb={setSb} active={true}/>}
          <TargetsPanel tg={tg} setTg={setTg} all={all} year={year} showPillars={is26}/>
        </aside>}
      </div>
    </>}

    {view==='trend' && <div className="grid grid-cols-1 xl:grid-cols-[1fr_340px] gap-4">
      <div className="space-y-4 min-w-0">
        <section className="card p-4"><h2 className="text-xl font-semibold">Total gross sales, 2024–2031</h2>
          <p className="text-sm mb-2" style={{color:'var(--muted)'}}>2026 = Jan–Sep actual (dark) + Oct–Dec projection (light). 2027–2031 roll each year's ending store base forward. Click a bar to open its bridge.</p>
          <div className="flex flex-wrap gap-x-4 text-xs mb-1" style={{color:'var(--muted)'}}><span className="flex items-center gap-1.5"><span className="w-4 border-t-2 border-dashed" style={{borderColor:C.inn}}/>Annual target (2026 team target, +{tg.g27}% in 2027, +{tg.gPost}%/yr 2028–2031)</span></div>
          <TrendTotals all={all} fmt={fmt} tg={tg} onPick={y=>{ setYear(y); setView('bridge'); }}/></section>
        <section className="card p-4"><h2 className="text-xl font-semibold">Same-store sales growth, 2025–2031</h2>
          <p className="text-sm mb-2" style={{color:'var(--muted)'}}>SSSG excluding innovation, vs each year's same-store baseline. 2027 onward follows the sandbox rates.</p>
          <SSSGLine all={all}/></section>
        <section className="card p-4"><h2 className="text-xl font-semibold">What drove each year's growth</h2>
          <p className="text-sm mb-2" style={{color:'var(--muted)'}}>Pillar contribution as % of prior-year sales; the dot is the YoY change. Gray = LY sales of stores outside the baseline.</p>
          <div className="flex flex-wrap gap-x-4 text-xs mb-1" style={{color:'var(--muted)'}}>
            {[[C.pos,'Same-store growth'],[C.neg,'Same-store decline'],[C.newS,'New stores'],[C.inn,'Innovation'],['#CDBFB1','Non-comparable LY stores']].map(([c,l])=><span key={l} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{background:c}}/>{l}</span>)}
            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full border-2" style={{borderColor:C.ink}}/>YoY total</span></div>
          <TrendContrib all={all}/></section>
      </div>
      <aside className="space-y-4"><Sandbox sb={sb} setSb={setSb} active={true}/><TargetsPanel tg={tg} setTg={setTg} all={all} year={null} showPillars={false}/></aside>
    </div>}

    {!auditInline && <AuditTable key="audit-full" all={all} fmt={fmt} tg={tg}/>}
    {auditInline && <div className="xl:hidden"><AuditTable key="audit-stacked" all={all} fmt={fmt} tg={tg}/></div>}

    <footer className="text-[11px] mt-5 leading-relaxed" style={{color:'var(--muted)'}}>
      <p><b>Same-store rule.</b> An outlet joins the baseline only after completing 13 full months of operation by 1 January of the bridge year (opening dates from One Mary Grace) and having sales in all 12 months of the prior year. Same-store growth = CY gross of baseline outlets minus their CY innovation sales, minus the baseline. New stores = CY gross of all other outlets, excluding innovation. Innovation = CY item gross of items first sold company-wide in that year (Innovation_2025 / Innovation_2026 lists, matched by item ID), split by café and kiosk and by same-store vs new-store outlets. Innovation is item revenue before service charge; store gross includes it.</p>
      <p className="mt-1"><b>Sources.</b> 2024–2026 from the uploaded store_month, iss_* and Innovation files; head-office "Others" excluded. 2026 balance of year and full year are projections. 2027–2031 are sandbox forecasts.</p>
    </footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
